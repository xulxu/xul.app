<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Placeholder</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1012;
      --fg: #0bb9e9;
      --dim: #1e4edc;
      --font: 'Press Start 2P', monospace;
      --max-width: 120rem;
      --cursor-width: 0.4rem;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Placeholder</h1>
  </div>
</body>
</html>
